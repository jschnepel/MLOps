# Development profile for Operations Copilot (OPS-BUILD-1.3.6, T05/T43/T44).
# Every published port binds to 127.0.0.1. Secrets are files under ${OPS_SECRETS_DIR}
# (generated by scripts/bootstrap_dev.py, never committed). `docker compose down -v` is destructive: never scripted.
# Images are pinned by digest so a moved tag cannot change the dev stack under us (tests/plan_b/test_compose_dev.py).
name: ops-copilot

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    profiles: ["dev"]
    ports:
      # Loopback only: the database must not be reachable from the LAN. The :? form fails fast with a hint when
      # .env has not been generated yet, instead of publishing a random port.
      - "127.0.0.1:${PG_PORT:?run scripts/bootstrap_dev.py secrets first}:5432"
    environment:
      POSTGRES_USER: ops
      POSTGRES_DB: ops
      # The postgres image supports *_FILE natively, so no entrypoint wrapper is needed (Keycloak has none; see below).
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./deploy/dev/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ops-dev-net]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    profiles: ["dev"]
    # Keycloak has no *_FILE variants, so a small entrypoint reads /run/secrets/kc_* into the process environment
    # (inside the container only, never in `environment:` and therefore never in `docker inspect`).
    entrypoint: ["/bin/bash", "/opt/ops/entrypoint.sh"]
    ports:
      - "127.0.0.1:${KC_HTTP_PORT:?run scripts/bootstrap_dev.py secrets first}:8080"
    environment:
      # Fixing the public hostname to localhost:<port> while allowing dynamic backchannel URLs makes the token `iss`
      # identical for host callers and container callers (docs/runbooks/dev-topology.md).
      KC_HOSTNAME: "http://localhost:${KC_HTTP_PORT}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: tmpadmin
      MCP_READ_RESOURCE_URL: "${MCP_READ_RESOURCE_URL}"
      MCP_WRITE_RESOURCE_URL: "${MCP_WRITE_RESOURCE_URL}"
    secrets:
      - kc_bootstrap_admin_password
      - kc_client_secret_ops_web
      - kc_client_secret_ops_worker
      - kc_client_secret_ops_mcp_read
      - kc_client_secret_ops_mcp_write
      - kc_persona_alex_password
      - kc_persona_sam_password
      - kc_client_secret_ops_view_users
      - kc_persona_lee_password
      - kc_persona_riley_password
      - kc_persona_jordan_password
    volumes:
      - ./deploy/dev/keycloak/entrypoint.sh:/opt/ops/entrypoint.sh:ro
      - ./deploy/dev/keycloak/realm-ops-dev.json:/opt/keycloak/data/import/realm-ops-dev.json:ro
    healthcheck:
      # Readiness on the management port; the HTTP status line is checked (a DOWN body still contains per-check "UP").
      # The Keycloak image ships neither curl nor wget, hence bash's /dev/tcp pseudo-device and a hand-written request.
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [ops-dev-net]

secrets:
  postgres_password:
    file: ${OPS_SECRETS_DIR}/postgres_password
  kc_bootstrap_admin_password:
    file: ${OPS_SECRETS_DIR}/kc_bootstrap_admin_password
  kc_client_secret_ops_web:
    file: ${OPS_SECRETS_DIR}/kc_client_secret_ops_web
  kc_client_secret_ops_worker:
    file: ${OPS_SECRETS_DIR}/kc_client_secret_ops_worker
  kc_client_secret_ops_mcp_read:
    file: ${OPS_SECRETS_DIR}/kc_client_secret_ops_mcp_read
  kc_client_secret_ops_mcp_write:
    file: ${OPS_SECRETS_DIR}/kc_client_secret_ops_mcp_write
  kc_persona_alex_password:
    file: ${OPS_SECRETS_DIR}/kc_persona_alex_password
  kc_persona_sam_password:
    file: ${OPS_SECRETS_DIR}/kc_persona_sam_password
  kc_client_secret_ops_view_users:
    file: ${OPS_SECRETS_DIR}/kc_client_secret_ops_view_users
  kc_persona_lee_password:
    file: ${OPS_SECRETS_DIR}/kc_persona_lee_password
  kc_persona_riley_password:
    file: ${OPS_SECRETS_DIR}/kc_persona_riley_password
  kc_persona_jordan_password:
    file: ${OPS_SECRETS_DIR}/kc_persona_jordan_password

volumes:
  pg-data:

networks:
  ops-dev-net:
    name: ops-dev-net
