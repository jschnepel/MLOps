[project]
name = "ops-incident-sim"
version = "0.0.1"
description = "Synthetic incident destination with its own database"
requires-python = ">=3.13"
dependencies = ["ops-core", "fastapi>=0.142,<1", "uvicorn>=0.54,<1"]

[tool.uv.sources]
ops-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_incident_sim"]
