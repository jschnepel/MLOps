[project]
name = "ops-worker"
version = "0.0.1"
description = "Run-lease worker: LangGraph orchestrator, LangChain draft node, MCP client"
requires-python = ">=3.13"
dependencies = [
  "ops-core",
  "mcp==2.3.0",
  "uvicorn>=0.54,<1",
  "langchain-ollama==1.1.0",
  # Imported directly by ops_worker.ollama_drafting, so declared at the versions langchain-ollama resolved (SA:582).
  "langchain-core==1.7.0",
  "ollama==0.6.3",
  "httpx==0.28.1",
  "langgraph==1.2.14",
  "langgraph-checkpoint-postgres==3.1.2",
]

[tool.uv.sources]
ops-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_worker"]
