[project]
name = "ops-worker"
version = "0.0.1"
description = "Run-lease worker: LangGraph orchestrator, LangChain draft node, MCP client"
requires-python = ">=3.13"
dependencies = ["ops-core"]

[tool.uv.sources]
ops-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_worker"]
