[project]
name = "operations-copilot-workspace"
version = "0.0.1"
description = "Operations Copilot: uv workspace root (ADR-0001). Not a package."
requires-python = ">=3.13"
dependencies = [
  "ops-core",
  "ops-api",
  "ops-worker",
  "ops-mcp-read",
  "ops-mcp-write",
  "ops-asset-sim",
  "ops-incident-sim",
]

[tool.uv]
package = false

[tool.uv.sources]
ops-core = { workspace = true }
ops-api = { workspace = true }
ops-worker = { workspace = true }
ops-mcp-read = { workspace = true }
ops-mcp-write = { workspace = true }
ops-asset-sim = { workspace = true }
ops-incident-sim = { workspace = true }

[tool.uv.workspace]
members = ["core", "api", "worker", "mcp-read", "mcp-write", "asset-sim", "incident-sim"]
exclude = ["reference"]

[dependency-groups]
dev = [
  "pytest>=9.0,<10",
  "ruff>=0.14,<1",
  "mypy>=1.19,<2",
  # best_match ranking is version-sensitive: the negatives' reason_match values are tuned to the locked version.
  "jsonschema>=4.26,<5",
  "hypothesis>=6.140,<7",
  "pyyaml>=6.0,<7",
  "rfc3339-validator>=0.1.4,<1",
  "pytest-asyncio>=1.4,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests/plan_a", "tests/plan_b", "tests/plan_c", "tests/plan_d", "tests/plan_e", "tests/e2e"]
asyncio_default_fixture_loop_scope = "function"
# Setting this replaces pytest's defaults (which include ".*"), so ".*" is restated: otherwise pytest walks .hypothesis/.
norecursedirs = ["reference", ".venv", "node_modules", "build", ".*"]
addopts = "-ra"

[tool.ruff]
line-length = 120
extend-exclude = ["reference", "docs"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["^reference/"]
