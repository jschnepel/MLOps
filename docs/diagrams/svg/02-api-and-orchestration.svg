<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1240" viewBox="0 0 1920 1240" role="img" aria-labelledby="title desc">
<title id="title">Stage 2: API &amp; Workflow Orchestration</title>
<desc id="desc">A standalone left-to-right target-design diagram. Five numbered steps connect with right-facing arrows. Supporting notes explain system connections and control boundaries.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#63748A"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="1920" height="1240" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="48" y="43.0" font-size="18" font-weight="700" fill="#465971">OPERATIONS COPILOT  /  STAGE DETAIL</text>
<rect x="1600" y="19" width="272" height="41" rx="20" fill="#ECF9F4" stroke="#098461" stroke-width="1.5"/>
<text x="1622" y="47.0" font-size="15" font-weight="700" fill="#098461">TARGET DESIGN • NOT LIVE</text>
<circle cx="82" cy="112" r="34" fill="#098461"/>
<text x="69" y="124.0" font-size="34" font-weight="700" fill="#FFFFFF">2</text>
<text x="135" y="127.0" font-size="46" font-weight="700" fill="#12253F">API &amp; Workflow Orchestration</text>
<text x="48" y="179.0" font-size="23" font-weight="400" fill="#465971">FastAPI admits durable work. LangGraph coordinates the workflow. Application code owns authority.</text>
<text x="48" y="217.0" font-size="16" font-weight="700" fill="#098461">READ LEFT → RIGHT WITHIN THIS STAGE</text>
<rect x="48" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="48" y="239" width="340" height="122" rx="17" fill="#ECF9F4" stroke="#ECF9F4" stroke-width="1.5"/>
<rect x="49" y="341" width="338" height="20" fill="#ECF9F4"/>
<text x="70" y="272.0" font-size="18" font-weight="700" fill="#098461">01</text>
<text x="70" y="309.0" font-size="24" font-weight="700" fill="#12253F">Authenticate &amp;</text>
<text x="70" y="338.0" font-size="24" font-weight="700" fill="#12253F">validate</text>
<circle cx="72" cy="391" r="3" fill="#098461"/>
<text x="86" y="398.0" font-size="20" font-weight="400" fill="#12253F">Verify the session and</text>
<text x="86" y="424.0" font-size="20" font-weight="400" fill="#12253F">current team membership.</text>
<circle cx="72" cy="455" r="3" fill="#098461"/>
<text x="86" y="462.0" font-size="20" font-weight="400" fill="#12253F">Check permissions, input</text>
<text x="86" y="488.0" font-size="20" font-weight="400" fill="#12253F">schema, and limits.</text>
<circle cx="72" cy="519" r="3" fill="#098461"/>
<text x="86" y="526.0" font-size="20" font-weight="400" fill="#12253F">Derive user and team</text>
<text x="86" y="552.0" font-size="20" font-weight="400" fill="#12253F">identity on the server.</text>
<line x1="69" y1="667" x2="367" y2="667" stroke="#D9E1EB"/>
<text x="69" y="692.0" font-size="14" font-weight="700" fill="#098461">COMPONENT: FastAPI</text>
<path d="M392,441 H413" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="419" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="419" y="239" width="340" height="122" rx="17" fill="#ECF9F4" stroke="#ECF9F4" stroke-width="1.5"/>
<rect x="420" y="341" width="338" height="20" fill="#ECF9F4"/>
<text x="441" y="272.0" font-size="18" font-weight="700" fill="#098461">02</text>
<text x="441" y="309.0" font-size="24" font-weight="700" fill="#12253F">Admit work durably</text>
<circle cx="443" cy="391" r="3" fill="#098461"/>
<text x="457" y="398.0" font-size="20" font-weight="400" fill="#12253F">Commit message, run, and</text>
<text x="457" y="424.0" font-size="20" font-weight="400" fill="#12253F">job in one transaction.</text>
<circle cx="443" cy="455" r="3" fill="#098461"/>
<text x="457" y="462.0" font-size="20" font-weight="400" fill="#12253F">Deduplicate repeated</text>
<text x="457" y="488.0" font-size="20" font-weight="400" fill="#12253F">request submissions.</text>
<circle cx="443" cy="519" r="3" fill="#098461"/>
<text x="457" y="526.0" font-size="20" font-weight="400" fill="#12253F">Return HTTP 202 and the</text>
<text x="457" y="552.0" font-size="20" font-weight="400" fill="#12253F">run ID after commit.</text>
<line x1="440" y1="667" x2="738" y2="667" stroke="#D9E1EB"/>
<text x="440" y="692.0" font-size="14" font-weight="700" fill="#098461">STORE: PostgreSQL</text>
<path d="M763,441 H784" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="790" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="790" y="239" width="340" height="122" rx="17" fill="#ECF9F4" stroke="#ECF9F4" stroke-width="1.5"/>
<rect x="791" y="341" width="338" height="20" fill="#ECF9F4"/>
<text x="812" y="272.0" font-size="18" font-weight="700" fill="#098461">03</text>
<text x="812" y="309.0" font-size="24" font-weight="700" fill="#12253F">Lease a queued job</text>
<circle cx="814" cy="391" r="3" fill="#098461"/>
<text x="828" y="398.0" font-size="20" font-weight="400" fill="#12253F">A worker claims a short,</text>
<text x="828" y="424.0" font-size="20" font-weight="400" fill="#12253F">renewable job lease.</text>
<circle cx="814" cy="455" r="3" fill="#098461"/>
<text x="828" y="462.0" font-size="20" font-weight="400" fill="#12253F">Use a fencing token to</text>
<text x="828" y="488.0" font-size="20" font-weight="400" fill="#12253F">reject stale workers.</text>
<circle cx="814" cy="519" r="3" fill="#098461"/>
<text x="828" y="526.0" font-size="20" font-weight="400" fill="#12253F">Do not hold a transaction</text>
<text x="828" y="552.0" font-size="20" font-weight="400" fill="#12253F">during model calls.</text>
<line x1="811" y1="667" x2="1109" y2="667" stroke="#D9E1EB"/>
<text x="811" y="692.0" font-size="14" font-weight="700" fill="#098461">RUNTIME: worker</text>
<path d="M1134,441 H1155" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="1161" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="1161" y="239" width="340" height="122" rx="17" fill="#ECF9F4" stroke="#ECF9F4" stroke-width="1.5"/>
<rect x="1162" y="341" width="338" height="20" fill="#ECF9F4"/>
<text x="1183" y="272.0" font-size="18" font-weight="700" fill="#098461">04</text>
<text x="1183" y="309.0" font-size="24" font-weight="700" fill="#12253F">Coordinate the graph</text>
<circle cx="1185" cy="391" r="3" fill="#098461"/>
<text x="1199" y="398.0" font-size="20" font-weight="400" fill="#12253F">Load checkpoint plus</text>
<text x="1199" y="424.0" font-size="20" font-weight="400" fill="#12253F">authoritative application</text>
<text x="1199" y="450.0" font-size="20" font-weight="400" fill="#12253F">state.</text>
<circle cx="1185" cy="481" r="3" fill="#098461"/>
<text x="1199" y="488.0" font-size="20" font-weight="400" fill="#12253F">Retrieve through Stage 4,</text>
<text x="1199" y="514.0" font-size="20" font-weight="400" fill="#12253F">then draft in Stage 3.</text>
<circle cx="1185" cy="545" r="3" fill="#098461"/>
<text x="1199" y="552.0" font-size="20" font-weight="400" fill="#12253F">Route the immutable</text>
<text x="1199" y="578.0" font-size="20" font-weight="400" fill="#12253F">proposal to Stage 5.</text>
<line x1="1182" y1="667" x2="1480" y2="667" stroke="#D9E1EB"/>
<text x="1182" y="692.0" font-size="14" font-weight="700" fill="#098461">ORCHESTRATOR: LangGraph</text>
<path d="M1505,441 H1526" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="1532" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="1532" y="239" width="340" height="122" rx="17" fill="#ECF9F4" stroke="#ECF9F4" stroke-width="1.5"/>
<rect x="1533" y="341" width="338" height="20" fill="#ECF9F4"/>
<text x="1554" y="272.0" font-size="18" font-weight="700" fill="#098461">05</text>
<text x="1554" y="309.0" font-size="24" font-weight="700" fill="#12253F">Pause, resume, or</text>
<text x="1554" y="338.0" font-size="24" font-weight="700" fill="#12253F">finish</text>
<circle cx="1556" cy="391" r="3" fill="#098461"/>
<text x="1570" y="398.0" font-size="20" font-weight="400" fill="#12253F">Persist clarification or</text>
<text x="1570" y="424.0" font-size="20" font-weight="400" fill="#12253F">approval waits; release the</text>
<text x="1570" y="450.0" font-size="20" font-weight="400" fill="#12253F">lease.</text>
<circle cx="1556" cy="481" r="3" fill="#098461"/>
<text x="1570" y="488.0" font-size="20" font-weight="400" fill="#12253F">Resume from a validated,</text>
<text x="1570" y="514.0" font-size="20" font-weight="400" fill="#12253F">committed user event.</text>
<circle cx="1556" cy="545" r="3" fill="#098461"/>
<text x="1570" y="552.0" font-size="20" font-weight="400" fill="#12253F">Store status and events for</text>
<text x="1570" y="578.0" font-size="20" font-weight="400" fill="#12253F">Stage 6.</text>
<line x1="1553" y1="667" x2="1851" y2="667" stroke="#D9E1EB"/>
<text x="1553" y="692.0" font-size="14" font-weight="700" fill="#098461">PERSISTENCE: checkpoints</text>
<rect x="48" y="742" width="586" height="176" rx="14" fill="#F8FAFD" stroke="#D9E1EB" stroke-width="1.5"/>
<text x="70" y="775.0" font-size="16" font-weight="700" fill="#098461">INPUT CONNECTION</text>
<text x="70" y="808.0" font-size="21" font-weight="400" fill="#12253F">Stage 1 sends commands. A job is acknowledged</text>
<text x="70" y="836.0" font-size="21" font-weight="400" fill="#12253F">only after its durable admission transaction</text>
<text x="70" y="864.0" font-size="21" font-weight="400" fill="#12253F">commits.</text>
<rect x="667" y="742" width="586" height="176" rx="14" fill="#F8FAFD" stroke="#D9E1EB" stroke-width="1.5"/>
<text x="689" y="775.0" font-size="16" font-weight="700" fill="#098461">SHARED COMPONENTS</text>
<text x="689" y="808.0" font-size="21" font-weight="400" fill="#12253F">PostgreSQL: jobs, runs, checkpoints, proposals,</text>
<text x="689" y="836.0" font-size="21" font-weight="400" fill="#12253F">approvals, events, outbox. OpenTelemetry:</text>
<text x="689" y="864.0" font-size="21" font-weight="400" fill="#12253F">diagnostics.</text>
<rect x="1286" y="742" width="586" height="176" rx="14" fill="#F8FAFD" stroke="#D9E1EB" stroke-width="1.5"/>
<text x="1308" y="775.0" font-size="16" font-weight="700" fill="#098461">OUTPUT CONNECTION</text>
<text x="1308" y="808.0" font-size="21" font-weight="400" fill="#12253F">Read tools: Stage 4. Model generation: Stage 3.</text>
<text x="1308" y="836.0" font-size="21" font-weight="400" fill="#12253F">Approval/write: Stage 5. User projections: Stage 6.</text>
<rect x="48" y="944" width="1824" height="112" rx="14" fill="#ECF9F4" stroke="#098461" stroke-width="1.5"/>
<text x="71" y="977.0" font-size="16" font-weight="700" fill="#098461">CONTROL BOUNDARY</text>
<text x="71" y="1014.0" font-size="23" font-weight="700" fill="#12253F">LangGraph coordinates execution; neither generated text nor a checkpoint grants permission to write.</text>
<text x="48" y="1095.0" font-size="15" font-weight="700" fill="#098461">WHY THIS CONNECTION</text>
<text x="48" y="1128.0" font-size="21" font-weight="400" fill="#465971">API and worker can share a Python image with different commands. PostgreSQL replaces SQLite before distributed deployment.</text>
<text x="48" y="1209.0" font-size="14" font-weight="400" fill="#465971">Stage labels identify responsibilities. LangGraph calls read tools before drafting; approved writes reuse the MCP boundary.</text>
<text x="1705" y="1209.0" font-size="15" font-weight="700" fill="#098461">STAGE 2 / 6</text>
</g></svg>