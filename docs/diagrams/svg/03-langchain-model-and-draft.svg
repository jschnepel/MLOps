<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1240" viewBox="0 0 1920 1240" role="img" aria-labelledby="title desc">
<title id="title">Stage 3: LangChain Model &amp; Draft Generation</title>
<desc id="desc">A standalone left-to-right target-design diagram. Five numbered steps connect with right-facing arrows. Supporting notes explain system connections and control boundaries.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#63748A"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="1920" height="1240" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="48" y="43.0" font-size="18" font-weight="700" fill="#465971">OPERATIONS COPILOT  /  STAGE DETAIL</text>
<rect x="1600" y="19" width="272" height="41" rx="20" fill="#F4EFFF" stroke="#7543C4" stroke-width="1.5"/>
<text x="1622" y="47.0" font-size="15" font-weight="700" fill="#7543C4">TARGET DESIGN • NOT LIVE</text>
<circle cx="82" cy="112" r="34" fill="#7543C4"/>
<text x="69" y="124.0" font-size="34" font-weight="700" fill="#FFFFFF">3</text>
<text x="135" y="127.0" font-size="46" font-weight="700" fill="#12253F">LangChain Model &amp; Draft Generation</text>
<text x="48" y="179.0" font-size="23" font-weight="400" fill="#465971">Generate only after authorized evidence is available. The output is a proposal, never permission or proof of execution.</text>
<text x="48" y="217.0" font-size="16" font-weight="700" fill="#7543C4">READ LEFT → RIGHT WITHIN THIS STAGE</text>
<rect x="48" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="48" y="239" width="340" height="122" rx="17" fill="#F4EFFF" stroke="#F4EFFF" stroke-width="1.5"/>
<rect x="49" y="341" width="338" height="20" fill="#F4EFFF"/>
<text x="70" y="272.0" font-size="18" font-weight="700" fill="#7543C4">01</text>
<text x="70" y="309.0" font-size="24" font-weight="700" fill="#12253F">Receive permitted</text>
<text x="70" y="338.0" font-size="24" font-weight="700" fill="#12253F">evidence</text>
<circle cx="72" cy="391" r="3" fill="#7543C4"/>
<text x="86" y="398.0" font-size="20" font-weight="400" fill="#12253F">Accept the validated</text>
<text x="86" y="424.0" font-size="20" font-weight="400" fill="#12253F">request from the worker.</text>
<circle cx="72" cy="455" r="3" fill="#7543C4"/>
<text x="86" y="462.0" font-size="20" font-weight="400" fill="#12253F">Use timestamped tool</text>
<text x="86" y="488.0" font-size="20" font-weight="400" fill="#12253F">results from Stage 4.</text>
<circle cx="72" cy="519" r="3" fill="#7543C4"/>
<text x="86" y="526.0" font-size="20" font-weight="400" fill="#12253F">Missing evidence triggers</text>
<text x="86" y="552.0" font-size="20" font-weight="400" fill="#12253F">clarification or abstention.</text>
<line x1="69" y1="667" x2="367" y2="667" stroke="#D9E1EB"/>
<text x="69" y="692.0" font-size="14" font-weight="700" fill="#7543C4">INPUT: authorized context</text>
<path d="M392,441 H413" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="419" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="419" y="239" width="340" height="122" rx="17" fill="#F4EFFF" stroke="#F4EFFF" stroke-width="1.5"/>
<rect x="420" y="341" width="338" height="20" fill="#F4EFFF"/>
<text x="441" y="272.0" font-size="18" font-weight="700" fill="#7543C4">02</text>
<text x="441" y="309.0" font-size="24" font-weight="700" fill="#12253F">Build the model input</text>
<circle cx="443" cy="391" r="3" fill="#7543C4"/>
<text x="457" y="398.0" font-size="20" font-weight="400" fill="#12253F">LangChain prepares prompt</text>
<text x="457" y="424.0" font-size="20" font-weight="400" fill="#12253F">templates and model</text>
<text x="457" y="450.0" font-size="20" font-weight="400" fill="#12253F">messages.</text>
<circle cx="443" cy="481" r="3" fill="#7543C4"/>
<text x="457" y="488.0" font-size="20" font-weight="400" fill="#12253F">Keep retrieved documents</text>
<text x="457" y="514.0" font-size="20" font-weight="400" fill="#12253F">separate from instructions.</text>
<circle cx="443" cy="545" r="3" fill="#7543C4"/>
<text x="457" y="552.0" font-size="20" font-weight="400" fill="#12253F">Bound context size and</text>
<text x="457" y="578.0" font-size="20" font-weight="400" fill="#12253F">include evidence IDs.</text>
<line x1="440" y1="667" x2="738" y2="667" stroke="#D9E1EB"/>
<text x="440" y="692.0" font-size="14" font-weight="700" fill="#7543C4">COMPONENT: LangChain</text>
<path d="M763,441 H784" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="790" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="790" y="239" width="340" height="122" rx="17" fill="#F4EFFF" stroke="#F4EFFF" stroke-width="1.5"/>
<rect x="791" y="341" width="338" height="20" fill="#F4EFFF"/>
<text x="812" y="272.0" font-size="18" font-weight="700" fill="#7543C4">03</text>
<text x="812" y="309.0" font-size="24" font-weight="700" fill="#12253F">Invoke the chosen</text>
<text x="812" y="338.0" font-size="24" font-weight="700" fill="#12253F">model</text>
<circle cx="814" cy="391" r="3" fill="#7543C4"/>
<text x="828" y="398.0" font-size="20" font-weight="400" fill="#12253F">ChatOllama connects the</text>
<text x="828" y="424.0" font-size="20" font-weight="400" fill="#12253F">worker to local Ollama.</text>
<circle cx="814" cy="455" r="3" fill="#7543C4"/>
<text x="828" y="462.0" font-size="20" font-weight="400" fill="#12253F">Request a structured draft</text>
<text x="828" y="488.0" font-size="20" font-weight="400" fill="#12253F">under a fixed schema.</text>
<circle cx="814" cy="519" r="3" fill="#7543C4"/>
<text x="828" y="526.0" font-size="20" font-weight="400" fill="#12253F">Apply time, output, and</text>
<text x="828" y="552.0" font-size="20" font-weight="400" fill="#12253F">attempt limits.</text>
<line x1="811" y1="667" x2="1109" y2="667" stroke="#D9E1EB"/>
<text x="811" y="692.0" font-size="14" font-weight="700" fill="#7543C4">RUNTIME: Ollama</text>
<path d="M1134,441 H1155" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="1161" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="1161" y="239" width="340" height="122" rx="17" fill="#F4EFFF" stroke="#F4EFFF" stroke-width="1.5"/>
<rect x="1162" y="341" width="338" height="20" fill="#F4EFFF"/>
<text x="1183" y="272.0" font-size="18" font-weight="700" fill="#7543C4">04</text>
<text x="1183" y="309.0" font-size="24" font-weight="700" fill="#12253F">Validate the draft</text>
<circle cx="1185" cy="391" r="3" fill="#7543C4"/>
<text x="1199" y="398.0" font-size="20" font-weight="400" fill="#12253F">Pydantic validates fields</text>
<text x="1199" y="424.0" font-size="20" font-weight="400" fill="#12253F">and rejects forbidden</text>
<text x="1199" y="450.0" font-size="20" font-weight="400" fill="#12253F">authority fields.</text>
<circle cx="1185" cy="481" r="3" fill="#7543C4"/>
<text x="1199" y="488.0" font-size="20" font-weight="400" fill="#12253F">Check citation IDs against</text>
<text x="1199" y="514.0" font-size="20" font-weight="400" fill="#12253F">retrieved evidence.</text>
<circle cx="1185" cy="545" r="3" fill="#7543C4"/>
<text x="1199" y="552.0" font-size="20" font-weight="400" fill="#12253F">Semantic support requires</text>
<text x="1199" y="578.0" font-size="20" font-weight="400" fill="#12253F">evaluation and review.</text>
<line x1="1182" y1="667" x2="1480" y2="667" stroke="#D9E1EB"/>
<text x="1182" y="692.0" font-size="14" font-weight="700" fill="#7543C4">CONTROL: application code</text>
<path d="M1505,441 H1526" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="1532" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="1532" y="239" width="340" height="122" rx="17" fill="#F4EFFF" stroke="#F4EFFF" stroke-width="1.5"/>
<rect x="1533" y="341" width="338" height="20" fill="#F4EFFF"/>
<text x="1554" y="272.0" font-size="18" font-weight="700" fill="#7543C4">05</text>
<text x="1554" y="309.0" font-size="24" font-weight="700" fill="#12253F">Freeze the proposal</text>
<circle cx="1556" cy="391" r="3" fill="#7543C4"/>
<text x="1570" y="398.0" font-size="20" font-weight="400" fill="#12253F">Store exact content,</text>
<text x="1570" y="424.0" font-size="20" font-weight="400" fill="#12253F">destination, and evidence</text>
<text x="1570" y="450.0" font-size="20" font-weight="400" fill="#12253F">versions.</text>
<circle cx="1556" cy="481" r="3" fill="#7543C4"/>
<text x="1570" y="488.0" font-size="20" font-weight="400" fill="#12253F">Assign a revision, payload</text>
<text x="1570" y="514.0" font-size="20" font-weight="400" fill="#12253F">hash, and expiry.</text>
<circle cx="1556" cy="545" r="3" fill="#7543C4"/>
<text x="1570" y="552.0" font-size="20" font-weight="400" fill="#12253F">Return the proposal for</text>
<text x="1570" y="578.0" font-size="20" font-weight="400" fill="#12253F">independent review.</text>
<line x1="1553" y1="667" x2="1851" y2="667" stroke="#D9E1EB"/>
<text x="1553" y="692.0" font-size="14" font-weight="700" fill="#7543C4">HANDOFF: Stage 5</text>
<rect x="48" y="742" width="586" height="176" rx="14" fill="#F8FAFD" stroke="#D9E1EB" stroke-width="1.5"/>
<text x="70" y="775.0" font-size="16" font-weight="700" fill="#7543C4">INPUT CONNECTION</text>
<text x="70" y="808.0" font-size="21" font-weight="400" fill="#12253F">LangGraph calls Stage 4 read tools before final</text>
<text x="70" y="836.0" font-size="21" font-weight="400" fill="#12253F">drafting. Stage numbers are component labels, not</text>
<text x="70" y="864.0" font-size="21" font-weight="400" fill="#12253F">a rigid call order.</text>
<rect x="667" y="742" width="586" height="176" rx="14" fill="#F8FAFD" stroke="#D9E1EB" stroke-width="1.5"/>
<text x="689" y="775.0" font-size="16" font-weight="700" fill="#7543C4">SHARED COMPONENTS</text>
<text x="689" y="808.0" font-size="21" font-weight="400" fill="#12253F">LangChain runs inside the workflow worker. It is</text>
<text x="689" y="836.0" font-size="21" font-weight="400" fill="#12253F">not an extra service or a second workflow</text>
<text x="689" y="864.0" font-size="21" font-weight="400" fill="#12253F">orchestrator.</text>
<rect x="1286" y="742" width="586" height="176" rx="14" fill="#F8FAFD" stroke="#D9E1EB" stroke-width="1.5"/>
<text x="1308" y="775.0" font-size="16" font-weight="700" fill="#7543C4">OUTPUT CONNECTION</text>
<text x="1308" y="808.0" font-size="21" font-weight="400" fill="#12253F">Stage 5 receives an immutable proposal. Stage 6</text>
<text x="1308" y="836.0" font-size="21" font-weight="400" fill="#12253F">can show the evidence, assumptions, and concise</text>
<text x="1308" y="864.0" font-size="21" font-weight="400" fill="#12253F">explanation.</text>
<rect x="48" y="944" width="1824" height="112" rx="14" fill="#F4EFFF" stroke="#7543C4" stroke-width="1.5"/>
<text x="71" y="977.0" font-size="16" font-weight="700" fill="#7543C4">CONTROL BOUNDARY</text>
<text x="71" y="1014.0" font-size="23" font-weight="700" fill="#12253F">Show evidence and explanation—not a fabricated internal thought process. Model reasoning is never an audit record.</text>
<text x="48" y="1095.0" font-size="15" font-weight="700" fill="#7543C4">WHY THIS CONNECTION</text>
<text x="48" y="1128.0" font-size="21" font-weight="400" fill="#465971">A deterministic model substitute tests control logic. Real-model trials separately measure answer quality and resource use.</text>
<text x="48" y="1209.0" font-size="14" font-weight="400" fill="#465971">Stage labels identify responsibilities. LangGraph calls read tools before drafting; approved writes reuse the MCP boundary.</text>
<text x="1705" y="1209.0" font-size="15" font-weight="700" fill="#7543C4">STAGE 3 / 6</text>
</g></svg>