<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1240" viewBox="0 0 1920 1240" role="img" aria-labelledby="title desc">
<title id="title">Stage 4: Tools &amp; Services via MCP</title>
<desc id="desc">A standalone left-to-right target-design diagram. Five numbered steps connect with right-facing arrows. Supporting notes explain system connections and control boundaries.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#63748A"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="1920" height="1240" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="48" y="43.0" font-size="18" font-weight="700" fill="#465971">OPERATIONS COPILOT  /  STAGE DETAIL</text>
<rect x="1600" y="19" width="272" height="41" rx="20" fill="#FFF8E8" stroke="#B77904" stroke-width="1.5"/>
<text x="1622" y="47.0" font-size="15" font-weight="700" fill="#B77904">TARGET DESIGN • NOT LIVE</text>
<circle cx="82" cy="112" r="34" fill="#B77904"/>
<text x="69" y="124.0" font-size="34" font-weight="700" fill="#FFFFFF">4</text>
<text x="135" y="127.0" font-size="46" font-weight="700" fill="#12253F">Tools &amp; Services via MCP</text>
<text x="48" y="179.0" font-size="23" font-weight="400" fill="#465971">One controlled tool boundary: read evidence before drafting; execute a write only after Stage 5 authorizes it.</text>
<text x="48" y="217.0" font-size="16" font-weight="700" fill="#B77904">READ LEFT → RIGHT WITHIN THIS STAGE</text>
<rect x="48" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="48" y="239" width="340" height="122" rx="17" fill="#FFF8E8" stroke="#FFF8E8" stroke-width="1.5"/>
<rect x="49" y="341" width="338" height="20" fill="#FFF8E8"/>
<text x="70" y="272.0" font-size="18" font-weight="700" fill="#B77904">01</text>
<text x="70" y="309.0" font-size="24" font-weight="700" fill="#12253F">Receive a tool</text>
<text x="70" y="338.0" font-size="24" font-weight="700" fill="#12253F">request</text>
<circle cx="72" cy="391" r="3" fill="#B77904"/>
<text x="86" y="398.0" font-size="20" font-weight="400" fill="#12253F">LangGraph selects an</text>
<text x="86" y="424.0" font-size="20" font-weight="400" fill="#12253F">allowlisted tool operation.</text>
<circle cx="72" cy="455" r="3" fill="#B77904"/>
<text x="86" y="462.0" font-size="20" font-weight="400" fill="#12253F">Use typed arguments with</text>
<text x="86" y="488.0" font-size="20" font-weight="400" fill="#12253F">bounded size and scope.</text>
<circle cx="72" cy="519" r="3" fill="#B77904"/>
<text x="86" y="526.0" font-size="20" font-weight="400" fill="#12253F">Read calls and approved</text>
<text x="86" y="552.0" font-size="20" font-weight="400" fill="#12253F">writes follow distinct rules.</text>
<line x1="69" y1="667" x2="367" y2="667" stroke="#D9E1EB"/>
<text x="69" y="692.0" font-size="14" font-weight="700" fill="#B77904">CALLER: workflow worker</text>
<path d="M392,441 H413" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="419" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="419" y="239" width="340" height="122" rx="17" fill="#FFF8E8" stroke="#FFF8E8" stroke-width="1.5"/>
<rect x="420" y="341" width="338" height="20" fill="#FFF8E8"/>
<text x="441" y="272.0" font-size="18" font-weight="700" fill="#B77904">02</text>
<text x="441" y="309.0" font-size="24" font-weight="700" fill="#12253F">Call the MCP server</text>
<circle cx="443" cy="391" r="3" fill="#B77904"/>
<text x="457" y="398.0" font-size="20" font-weight="400" fill="#12253F">Use a real MCP client over</text>
<text x="457" y="424.0" font-size="20" font-weight="400" fill="#12253F">authenticated transport.</text>
<circle cx="443" cy="455" r="3" fill="#B77904"/>
<text x="457" y="462.0" font-size="20" font-weight="400" fill="#12253F">Optional LangChain adapter</text>
<text x="457" y="488.0" font-size="20" font-weight="400" fill="#12253F">exposes compatible tools.</text>
<circle cx="443" cy="519" r="3" fill="#B77904"/>
<text x="457" y="526.0" font-size="20" font-weight="400" fill="#12253F">Send scoped service</text>
<text x="457" y="552.0" font-size="20" font-weight="400" fill="#12253F">credentials and trusted run</text>
<text x="457" y="578.0" font-size="20" font-weight="400" fill="#12253F">context.</text>
<line x1="440" y1="667" x2="738" y2="667" stroke="#D9E1EB"/>
<text x="440" y="692.0" font-size="14" font-weight="700" fill="#B77904">INTERFACE: MCP</text>
<path d="M763,441 H784" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="790" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="790" y="239" width="340" height="122" rx="17" fill="#FFF8E8" stroke="#FFF8E8" stroke-width="1.5"/>
<rect x="791" y="341" width="338" height="20" fill="#FFF8E8"/>
<text x="812" y="272.0" font-size="18" font-weight="700" fill="#B77904">03</text>
<text x="812" y="309.0" font-size="24" font-weight="700" fill="#12253F">Enforce server policy</text>
<circle cx="814" cy="391" r="3" fill="#B77904"/>
<text x="828" y="398.0" font-size="20" font-weight="400" fill="#12253F">Validate credential</text>
<text x="828" y="424.0" font-size="20" font-weight="400" fill="#12253F">audience, expiry, and</text>
<text x="828" y="450.0" font-size="20" font-weight="400" fill="#12253F">scopes.</text>
<circle cx="814" cy="481" r="3" fill="#B77904"/>
<text x="828" y="488.0" font-size="20" font-weight="400" fill="#12253F">Resolve current access</text>
<text x="828" y="514.0" font-size="20" font-weight="400" fill="#12253F">from trusted identity.</text>
<circle cx="814" cy="545" r="3" fill="#B77904"/>
<text x="828" y="552.0" font-size="20" font-weight="400" fill="#12253F">Reject unexpected tools</text>
<text x="828" y="578.0" font-size="20" font-weight="400" fill="#12253F">and invalid arguments.</text>
<line x1="811" y1="667" x2="1109" y2="667" stroke="#D9E1EB"/>
<text x="811" y="692.0" font-size="14" font-weight="700" fill="#B77904">BOUNDARY: MCP server</text>
<path d="M1134,441 H1155" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="1161" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="1161" y="239" width="340" height="122" rx="17" fill="#FFF8E8" stroke="#FFF8E8" stroke-width="1.5"/>
<rect x="1162" y="341" width="338" height="20" fill="#FFF8E8"/>
<text x="1183" y="272.0" font-size="18" font-weight="700" fill="#B77904">04</text>
<text x="1183" y="309.0" font-size="24" font-weight="700" fill="#12253F">Route the allowed</text>
<text x="1183" y="338.0" font-size="24" font-weight="700" fill="#12253F">call</text>
<circle cx="1185" cy="391" r="3" fill="#B77904"/>
<text x="1199" y="398.0" font-size="20" font-weight="400" fill="#12253F">Read: asset status, recent</text>
<text x="1199" y="424.0" font-size="20" font-weight="400" fill="#12253F">alerts, procedure search.</text>
<circle cx="1185" cy="455" r="3" fill="#B77904"/>
<text x="1199" y="462.0" font-size="20" font-weight="400" fill="#12253F">Write: create_incident with</text>
<text x="1199" y="488.0" font-size="20" font-weight="400" fill="#12253F">an approved proposal ID.</text>
<circle cx="1185" cy="519" r="3" fill="#B77904"/>
<text x="1199" y="526.0" font-size="20" font-weight="400" fill="#12253F">Recheck write authority at</text>
<text x="1199" y="552.0" font-size="20" font-weight="400" fill="#12253F">the execution boundary.</text>
<line x1="1182" y1="667" x2="1480" y2="667" stroke="#D9E1EB"/>
<text x="1182" y="692.0" font-size="14" font-weight="700" fill="#B77904">SERVICES: synthetic only</text>
<path d="M1505,441 H1526" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="1532" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="1532" y="239" width="340" height="122" rx="17" fill="#FFF8E8" stroke="#FFF8E8" stroke-width="1.5"/>
<rect x="1533" y="341" width="338" height="20" fill="#FFF8E8"/>
<text x="1554" y="272.0" font-size="18" font-weight="700" fill="#B77904">05</text>
<text x="1554" y="309.0" font-size="24" font-weight="700" fill="#12253F">Validate the result</text>
<circle cx="1556" cy="391" r="3" fill="#B77904"/>
<text x="1570" y="398.0" font-size="20" font-weight="400" fill="#12253F">Read results carry evidence</text>
<text x="1570" y="424.0" font-size="20" font-weight="400" fill="#12253F">IDs and timestamps.</text>
<circle cx="1556" cy="455" r="3" fill="#B77904"/>
<text x="1570" y="462.0" font-size="20" font-weight="400" fill="#12253F">Writes return a verified</text>
<text x="1570" y="488.0" font-size="20" font-weight="400" fill="#12253F">receipt or uncertain status.</text>
<circle cx="1556" cy="519" r="3" fill="#B77904"/>
<text x="1570" y="526.0" font-size="20" font-weight="400" fill="#12253F">Bound and redact results</text>
<text x="1570" y="552.0" font-size="20" font-weight="400" fill="#12253F">before persisting events.</text>
<line x1="1553" y1="667" x2="1851" y2="667" stroke="#D9E1EB"/>
<text x="1553" y="692.0" font-size="14" font-weight="700" fill="#B77904">RETURN: worker + events</text>
<rect x="48" y="742" width="586" height="176" rx="14" fill="#F8FAFD" stroke="#D9E1EB" stroke-width="1.5"/>
<text x="70" y="775.0" font-size="16" font-weight="700" fill="#B77904">READ CONNECTION</text>
<text x="70" y="808.0" font-size="21" font-weight="400" fill="#12253F">Asset/alert service + approved procedures. Apply</text>
<text x="70" y="836.0" font-size="21" font-weight="400" fill="#12253F">source access before results reach the Stage 3</text>
<text x="70" y="864.0" font-size="21" font-weight="400" fill="#12253F">model.</text>
<rect x="667" y="742" width="586" height="176" rx="14" fill="#F8FAFD" stroke="#D9E1EB" stroke-width="1.5"/>
<text x="689" y="775.0" font-size="16" font-weight="700" fill="#B77904">WRITE CONNECTION</text>
<text x="689" y="808.0" font-size="21" font-weight="400" fill="#12253F">Stage 5 → guarded MCP write → incident service.</text>
<text x="689" y="836.0" font-size="21" font-weight="400" fill="#12253F">The destination atomically stores the incident and</text>
<text x="689" y="864.0" font-size="21" font-weight="400" fill="#12253F">deduplication receipt.</text>
<rect x="1286" y="742" width="586" height="176" rx="14" fill="#F8FAFD" stroke="#D9E1EB" stroke-width="1.5"/>
<text x="1308" y="775.0" font-size="16" font-weight="700" fill="#B77904">SHARED COMPONENTS</text>
<text x="1308" y="808.0" font-size="21" font-weight="400" fill="#12253F">PostgreSQL/pgvector can hold governed evidence.</text>
<text x="1308" y="836.0" font-size="21" font-weight="400" fill="#12253F">The incident destination has a logically</text>
<text x="1308" y="864.0" font-size="21" font-weight="400" fill="#12253F">independent receipt store.</text>
<rect x="48" y="944" width="1824" height="112" rx="14" fill="#FFF8E8" stroke="#B77904" stroke-width="1.5"/>
<text x="71" y="977.0" font-size="16" font-weight="700" fill="#B77904">CONTROL BOUNDARY</text>
<text x="71" y="1014.0" font-size="23" font-weight="700" fill="#12253F">MCP is a tool protocol—not the scheduler or permission policy. Model-supplied roles and “approved=true” are not authority.</text>
<text x="48" y="1095.0" font-size="15" font-weight="700" fill="#B77904">WHY THIS CONNECTION</text>
<text x="48" y="1128.0" font-size="21" font-weight="400" fill="#465971">A separate MCP service makes contracts and access failures testable with an independent client. No generic shell, SQL, or URL-fetch tool.</text>
<text x="48" y="1209.0" font-size="14" font-weight="400" fill="#465971">Stage labels identify responsibilities. LangGraph calls read tools before drafting; approved writes reuse the MCP boundary.</text>
<text x="1705" y="1209.0" font-size="15" font-weight="700" fill="#B77904">STAGE 4 / 6</text>
</g></svg>