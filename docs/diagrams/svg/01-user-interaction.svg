<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1240" viewBox="0 0 1920 1240" role="img" aria-labelledby="title desc">
<title id="title">Stage 1: User Interaction</title>
<desc id="desc">A standalone left-to-right target-design diagram. Five numbered steps connect with right-facing arrows. Supporting notes explain system connections and control boundaries.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#63748A"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="1920" height="1240" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="48" y="43.0" font-size="18" font-weight="700" fill="#465971">OPERATIONS COPILOT  /  STAGE DETAIL</text>
<rect x="1600" y="19" width="272" height="41" rx="20" fill="#EDF5FF" stroke="#1468CC" stroke-width="1.5"/>
<text x="1622" y="47.0" font-size="15" font-weight="700" fill="#1468CC">TARGET DESIGN • NOT LIVE</text>
<circle cx="82" cy="112" r="34" fill="#1468CC"/>
<text x="69" y="124.0" font-size="34" font-weight="700" fill="#FFFFFF">1</text>
<text x="135" y="127.0" font-size="46" font-weight="700" fill="#12253F">User Interaction</text>
<text x="48" y="179.0" font-size="23" font-weight="400" fill="#465971">A two-way conversation: submit a request, answer questions, review evidence, and see recorded progress.</text>
<text x="48" y="217.0" font-size="16" font-weight="700" fill="#1468CC">READ LEFT → RIGHT WITHIN THIS STAGE</text>
<rect x="48" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="48" y="239" width="340" height="122" rx="17" fill="#EDF5FF" stroke="#EDF5FF" stroke-width="1.5"/>
<rect x="49" y="341" width="338" height="20" fill="#EDF5FF"/>
<text x="70" y="272.0" font-size="18" font-weight="700" fill="#1468CC">01</text>
<text x="70" y="309.0" font-size="24" font-weight="700" fill="#12253F">Compose the request</text>
<circle cx="72" cy="391" r="3" fill="#1468CC"/>
<text x="86" y="398.0" font-size="20" font-weight="400" fill="#12253F">Identify the asset and</text>
<text x="86" y="424.0" font-size="20" font-weight="400" fill="#12253F">investigation period.</text>
<circle cx="72" cy="455" r="3" fill="#1468CC"/>
<text x="86" y="462.0" font-size="20" font-weight="400" fill="#12253F">Ask a question or request</text>
<text x="86" y="488.0" font-size="20" font-weight="400" fill="#12253F">an incident draft.</text>
<circle cx="72" cy="519" r="3" fill="#1468CC"/>
<text x="86" y="526.0" font-size="20" font-weight="400" fill="#12253F">Use synthetic operational</text>
<text x="86" y="552.0" font-size="20" font-weight="400" fill="#12253F">data only.</text>
<line x1="69" y1="667" x2="367" y2="667" stroke="#D9E1EB"/>
<text x="69" y="692.0" font-size="14" font-weight="700" fill="#1468CC">INPUT: message + context</text>
<path d="M392,441 H413" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="419" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="419" y="239" width="340" height="122" rx="17" fill="#EDF5FF" stroke="#EDF5FF" stroke-width="1.5"/>
<rect x="420" y="341" width="338" height="20" fill="#EDF5FF"/>
<text x="441" y="272.0" font-size="18" font-weight="700" fill="#1468CC">02</text>
<text x="441" y="309.0" font-size="24" font-weight="700" fill="#12253F">Use the web</text>
<text x="441" y="338.0" font-size="24" font-weight="700" fill="#12253F">workspace</text>
<circle cx="443" cy="391" r="3" fill="#1468CC"/>
<text x="457" y="398.0" font-size="20" font-weight="400" fill="#12253F">React + TypeScript: chat,</text>
<text x="457" y="424.0" font-size="20" font-weight="400" fill="#12253F">evidence, activity,</text>
<text x="457" y="450.0" font-size="20" font-weight="400" fill="#12253F">approvals.</text>
<circle cx="443" cy="481" r="3" fill="#1468CC"/>
<text x="457" y="488.0" font-size="20" font-weight="400" fill="#12253F">Sign in through the</text>
<text x="457" y="514.0" font-size="20" font-weight="400" fill="#12253F">configured identity</text>
<text x="457" y="540.0" font-size="20" font-weight="400" fill="#12253F">provider.</text>
<circle cx="443" cy="571" r="3" fill="#1468CC"/>
<text x="457" y="578.0" font-size="20" font-weight="400" fill="#12253F">The interface does not</text>
<text x="457" y="604.0" font-size="20" font-weight="400" fill="#12253F">grant permissions.</text>
<line x1="440" y1="667" x2="738" y2="667" stroke="#D9E1EB"/>
<text x="440" y="692.0" font-size="14" font-weight="700" fill="#1468CC">CLIENT: web first</text>
<path d="M763,441 H784" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="790" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="790" y="239" width="340" height="122" rx="17" fill="#EDF5FF" stroke="#EDF5FF" stroke-width="1.5"/>
<rect x="791" y="341" width="338" height="20" fill="#EDF5FF"/>
<text x="812" y="272.0" font-size="18" font-weight="700" fill="#1468CC">03</text>
<text x="812" y="309.0" font-size="24" font-weight="700" fill="#12253F">Submit an HTTP</text>
<text x="812" y="338.0" font-size="24" font-weight="700" fill="#12253F">command</text>
<circle cx="814" cy="391" r="3" fill="#1468CC"/>
<text x="828" y="398.0" font-size="20" font-weight="400" fill="#12253F">Send the request to FastAPI</text>
<text x="828" y="424.0" font-size="20" font-weight="400" fill="#12253F">over HTTPS.</text>
<circle cx="814" cy="455" r="3" fill="#1468CC"/>
<text x="828" y="462.0" font-size="20" font-weight="400" fill="#12253F">Include the session and a</text>
<text x="828" y="488.0" font-size="20" font-weight="400" fill="#12253F">request deduplication key.</text>
<circle cx="814" cy="519" r="3" fill="#1468CC"/>
<text x="828" y="526.0" font-size="20" font-weight="400" fill="#12253F">Show the accepted run ID</text>
<text x="828" y="552.0" font-size="20" font-weight="400" fill="#12253F">after durable admission.</text>
<line x1="811" y1="667" x2="1109" y2="667" stroke="#D9E1EB"/>
<text x="811" y="692.0" font-size="14" font-weight="700" fill="#1468CC">HANDOFF: Stage 2</text>
<path d="M1134,441 H1155" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="1161" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="1161" y="239" width="340" height="122" rx="17" fill="#EDF5FF" stroke="#EDF5FF" stroke-width="1.5"/>
<rect x="1162" y="341" width="338" height="20" fill="#EDF5FF"/>
<text x="1183" y="272.0" font-size="18" font-weight="700" fill="#1468CC">04</text>
<text x="1183" y="309.0" font-size="24" font-weight="700" fill="#12253F">Clarify or review</text>
<circle cx="1185" cy="391" r="3" fill="#1468CC"/>
<text x="1199" y="398.0" font-size="20" font-weight="400" fill="#12253F">Reply to a stored</text>
<text x="1199" y="424.0" font-size="20" font-weight="400" fill="#12253F">clarification request.</text>
<circle cx="1185" cy="455" r="3" fill="#1468CC"/>
<text x="1199" y="462.0" font-size="20" font-weight="400" fill="#12253F">Inspect the exact proposal</text>
<text x="1199" y="488.0" font-size="20" font-weight="400" fill="#12253F">and its sources.</text>
<circle cx="1185" cy="519" r="3" fill="#1468CC"/>
<text x="1199" y="526.0" font-size="20" font-weight="400" fill="#12253F">Only an independent</text>
<text x="1199" y="552.0" font-size="20" font-weight="400" fill="#12253F">authorized reviewer</text>
<text x="1199" y="578.0" font-size="20" font-weight="400" fill="#12253F">approves.</text>
<line x1="1182" y1="667" x2="1480" y2="667" stroke="#D9E1EB"/>
<text x="1182" y="692.0" font-size="14" font-weight="700" fill="#1468CC">REVIEW: Stage 5</text>
<path d="M1505,441 H1526" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="1532" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="1532" y="239" width="340" height="122" rx="17" fill="#EDF5FF" stroke="#EDF5FF" stroke-width="1.5"/>
<rect x="1533" y="341" width="338" height="20" fill="#EDF5FF"/>
<text x="1554" y="272.0" font-size="18" font-weight="700" fill="#1468CC">05</text>
<text x="1554" y="309.0" font-size="24" font-weight="700" fill="#12253F">Receive live updates</text>
<circle cx="1556" cy="391" r="3" fill="#1468CC"/>
<text x="1570" y="398.0" font-size="20" font-weight="400" fill="#12253F">Read authorized, persisted</text>
<text x="1570" y="424.0" font-size="20" font-weight="400" fill="#12253F">events over SSE.</text>
<circle cx="1556" cy="455" r="3" fill="#1468CC"/>
<text x="1570" y="462.0" font-size="20" font-weight="400" fill="#12253F">Replay missed events after</text>
<text x="1570" y="488.0" font-size="20" font-weight="400" fill="#12253F">reconnecting.</text>
<circle cx="1556" cy="519" r="3" fill="#1468CC"/>
<text x="1570" y="526.0" font-size="20" font-weight="400" fill="#12253F">Display confirmed or</text>
<text x="1570" y="552.0" font-size="20" font-weight="400" fill="#12253F">explicitly unknown</text>
<text x="1570" y="578.0" font-size="20" font-weight="400" fill="#12253F">outcomes.</text>
<line x1="1553" y1="667" x2="1851" y2="667" stroke="#D9E1EB"/>
<text x="1553" y="692.0" font-size="14" font-weight="700" fill="#1468CC">FEEDBACK: Stage 6</text>
<rect x="48" y="742" width="586" height="176" rx="14" fill="#F8FAFD" stroke="#D9E1EB" stroke-width="1.5"/>
<text x="70" y="775.0" font-size="16" font-weight="700" fill="#1468CC">INPUT CONNECTION</text>
<text x="70" y="808.0" font-size="21" font-weight="400" fill="#12253F">The operator provides a request. An independent</text>
<text x="70" y="836.0" font-size="21" font-weight="400" fill="#12253F">reviewer can later inspect and decide on the</text>
<text x="70" y="864.0" font-size="21" font-weight="400" fill="#12253F">proposal.</text>
<rect x="667" y="742" width="586" height="176" rx="14" fill="#F8FAFD" stroke="#D9E1EB" stroke-width="1.5"/>
<text x="689" y="775.0" font-size="16" font-weight="700" fill="#1468CC">SHARED COMPONENTS</text>
<text x="689" y="808.0" font-size="21" font-weight="400" fill="#12253F">FastAPI owns access checks. PostgreSQL stores</text>
<text x="689" y="836.0" font-size="21" font-weight="400" fill="#12253F">conversations and events. Slack is optional; voice</text>
<text x="689" y="864.0" font-size="21" font-weight="400" fill="#12253F">is deferred.</text>
<rect x="1286" y="742" width="586" height="176" rx="14" fill="#F8FAFD" stroke="#D9E1EB" stroke-width="1.5"/>
<text x="1308" y="775.0" font-size="16" font-weight="700" fill="#1468CC">OUTPUT CONNECTION</text>
<text x="1308" y="808.0" font-size="21" font-weight="400" fill="#12253F">Stage 2 receives durable commands. Stage 6</text>
<text x="1308" y="836.0" font-size="21" font-weight="400" fill="#12253F">supplies progress and results. Status questions do</text>
<text x="1308" y="864.0" font-size="21" font-weight="400" fill="#12253F">not create duplicate jobs.</text>
<rect x="48" y="944" width="1824" height="112" rx="14" fill="#EDF5FF" stroke="#1468CC" stroke-width="1.5"/>
<text x="71" y="977.0" font-size="16" font-weight="700" fill="#1468CC">CONTROL BOUNDARY</text>
<text x="71" y="1014.0" font-size="23" font-weight="700" fill="#12253F">Clarification is not approval. A chat message saying “yes” is not an execution grant.</text>
<text x="48" y="1095.0" font-size="15" font-weight="700" fill="#1468CC">WHY THIS CONNECTION</text>
<text x="48" y="1128.0" font-size="21" font-weight="400" fill="#465971">HTTP carries user commands; SSE carries authorized progress. Reconnection restores the view without restarting the work.</text>
<text x="48" y="1209.0" font-size="14" font-weight="400" fill="#465971">Stage labels identify responsibilities. LangGraph calls read tools before drafting; approved writes reuse the MCP boundary.</text>
<text x="1705" y="1209.0" font-size="15" font-weight="700" fill="#1468CC">STAGE 1 / 6</text>
</g></svg>