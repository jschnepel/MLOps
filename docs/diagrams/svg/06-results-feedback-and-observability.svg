<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1240" viewBox="0 0 1920 1240" role="img" aria-labelledby="title desc">
<title id="title">Stage 6: Results, Feedback &amp; Observability</title>
<desc id="desc">A standalone left-to-right target-design diagram. Five numbered steps connect with right-facing arrows. Supporting notes explain system connections and control boundaries.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#63748A"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="1920" height="1240" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="48" y="43.0" font-size="18" font-weight="700" fill="#465971">OPERATIONS COPILOT  /  STAGE DETAIL</text>
<rect x="1600" y="19" width="272" height="41" rx="20" fill="#ECF6FF" stroke="#176DB8" stroke-width="1.5"/>
<text x="1622" y="47.0" font-size="15" font-weight="700" fill="#176DB8">TARGET DESIGN • NOT LIVE</text>
<circle cx="82" cy="112" r="34" fill="#176DB8"/>
<text x="69" y="124.0" font-size="34" font-weight="700" fill="#FFFFFF">6</text>
<text x="135" y="127.0" font-size="46" font-weight="700" fill="#12253F">Results, Feedback &amp; Observability</text>
<text x="48" y="179.0" font-size="23" font-weight="400" fill="#465971">Keep users informed throughout the run. Final claims come from recorded evidence and confirmed destination outcomes.</text>
<text x="48" y="217.0" font-size="16" font-weight="700" fill="#176DB8">READ LEFT → RIGHT WITHIN THIS STAGE</text>
<rect x="48" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="48" y="239" width="340" height="122" rx="17" fill="#ECF6FF" stroke="#ECF6FF" stroke-width="1.5"/>
<rect x="49" y="341" width="338" height="20" fill="#ECF6FF"/>
<text x="70" y="272.0" font-size="18" font-weight="700" fill="#176DB8">01</text>
<text x="70" y="309.0" font-size="24" font-weight="700" fill="#12253F">Persist the actual</text>
<text x="70" y="338.0" font-size="24" font-weight="700" fill="#12253F">state</text>
<circle cx="72" cy="391" r="3" fill="#176DB8"/>
<text x="86" y="398.0" font-size="20" font-weight="400" fill="#12253F">Record confirmed success,</text>
<text x="86" y="424.0" font-size="20" font-weight="400" fill="#12253F">failure, or unknown status.</text>
<circle cx="72" cy="455" r="3" fill="#176DB8"/>
<text x="86" y="462.0" font-size="20" font-weight="400" fill="#12253F">Save ordered events with</text>
<text x="86" y="488.0" font-size="20" font-weight="400" fill="#12253F">run and action IDs.</text>
<circle cx="72" cy="519" r="3" fill="#176DB8"/>
<text x="86" y="526.0" font-size="20" font-weight="400" fill="#12253F">Commit notification intent</text>
<text x="86" y="552.0" font-size="20" font-weight="400" fill="#12253F">in the outbox.</text>
<line x1="69" y1="667" x2="367" y2="667" stroke="#D9E1EB"/>
<text x="69" y="692.0" font-size="14" font-weight="700" fill="#176DB8">SOURCE: application records</text>
<path d="M392,441 H413" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="419" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="419" y="239" width="340" height="122" rx="17" fill="#ECF6FF" stroke="#ECF6FF" stroke-width="1.5"/>
<rect x="420" y="341" width="338" height="20" fill="#ECF6FF"/>
<text x="441" y="272.0" font-size="18" font-weight="700" fill="#176DB8">02</text>
<text x="441" y="309.0" font-size="24" font-weight="700" fill="#12253F">Stream permitted</text>
<text x="441" y="338.0" font-size="24" font-weight="700" fill="#12253F">events</text>
<circle cx="443" cy="391" r="3" fill="#176DB8"/>
<text x="457" y="398.0" font-size="20" font-weight="400" fill="#12253F">Authorize the SSE stream</text>
<text x="457" y="424.0" font-size="20" font-weight="400" fill="#12253F">and event-history requests.</text>
<circle cx="443" cy="455" r="3" fill="#176DB8"/>
<text x="457" y="462.0" font-size="20" font-weight="400" fill="#12253F">Replay from the last cursor</text>
<text x="457" y="488.0" font-size="20" font-weight="400" fill="#12253F">after reconnecting.</text>
<circle cx="443" cy="519" r="3" fill="#176DB8"/>
<text x="457" y="526.0" font-size="20" font-weight="400" fill="#12253F">Recheck session and</text>
<text x="457" y="552.0" font-size="20" font-weight="400" fill="#12253F">access during long streams.</text>
<line x1="440" y1="667" x2="738" y2="667" stroke="#D9E1EB"/>
<text x="440" y="692.0" font-size="14" font-weight="700" fill="#176DB8">TRANSPORT: SSE + HTTP</text>
<path d="M763,441 H784" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="790" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="790" y="239" width="340" height="122" rx="17" fill="#ECF6FF" stroke="#ECF6FF" stroke-width="1.5"/>
<rect x="791" y="341" width="338" height="20" fill="#ECF6FF"/>
<text x="812" y="272.0" font-size="18" font-weight="700" fill="#176DB8">03</text>
<text x="812" y="309.0" font-size="24" font-weight="700" fill="#12253F">Explain with evidence</text>
<circle cx="814" cy="391" r="3" fill="#176DB8"/>
<text x="828" y="398.0" font-size="20" font-weight="400" fill="#12253F">Show the recommendation</text>
<text x="828" y="424.0" font-size="20" font-weight="400" fill="#12253F">and permitted sources.</text>
<circle cx="814" cy="455" r="3" fill="#176DB8"/>
<text x="828" y="462.0" font-size="20" font-weight="400" fill="#12253F">Separate assumptions from</text>
<text x="828" y="488.0" font-size="20" font-weight="400" fill="#12253F">confirmed actions.</text>
<circle cx="814" cy="519" r="3" fill="#176DB8"/>
<text x="828" y="526.0" font-size="20" font-weight="400" fill="#12253F">Present tool outcomes in an</text>
<text x="828" y="552.0" font-size="20" font-weight="400" fill="#12253F">inspectable timeline.</text>
<line x1="811" y1="667" x2="1109" y2="667" stroke="#D9E1EB"/>
<text x="811" y="692.0" font-size="14" font-weight="700" fill="#176DB8">DISPLAY: web workspace</text>
<path d="M1134,441 H1155" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="1161" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="1161" y="239" width="340" height="122" rx="17" fill="#ECF6FF" stroke="#ECF6FF" stroke-width="1.5"/>
<rect x="1162" y="341" width="338" height="20" fill="#ECF6FF"/>
<text x="1183" y="272.0" font-size="18" font-weight="700" fill="#176DB8">04</text>
<text x="1183" y="309.0" font-size="24" font-weight="700" fill="#12253F">Deliver optional</text>
<text x="1183" y="338.0" font-size="24" font-weight="700" fill="#12253F">alerts</text>
<circle cx="1185" cy="391" r="3" fill="#176DB8"/>
<text x="1199" y="398.0" font-size="20" font-weight="400" fill="#12253F">An outbox worker delivers</text>
<text x="1199" y="424.0" font-size="20" font-weight="400" fill="#12253F">opted-in Slack notifications.</text>
<circle cx="1185" cy="455" r="3" fill="#176DB8"/>
<text x="1199" y="462.0" font-size="20" font-weight="400" fill="#12253F">Resolve recipients from</text>
<text x="1199" y="488.0" font-size="20" font-weight="400" fill="#12253F">approved identity</text>
<text x="1199" y="514.0" font-size="20" font-weight="400" fill="#12253F">mappings.</text>
<circle cx="1185" cy="545" r="3" fill="#176DB8"/>
<text x="1199" y="552.0" font-size="20" font-weight="400" fill="#12253F">Track delivery failures</text>
<text x="1199" y="578.0" font-size="20" font-weight="400" fill="#12253F">separately from run</text>
<text x="1199" y="604.0" font-size="20" font-weight="400" fill="#12253F">success.</text>
<line x1="1182" y1="667" x2="1480" y2="667" stroke="#D9E1EB"/>
<text x="1182" y="692.0" font-size="14" font-weight="700" fill="#176DB8">EXTENSION: Slack</text>
<path d="M1505,441 H1526" stroke="#63748A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="1532" y="239" width="340" height="475" rx="17" fill="#FFFFFF" stroke="#D9E1EB" stroke-width="1.5"/>
<rect x="1532" y="239" width="340" height="122" rx="17" fill="#ECF6FF" stroke="#ECF6FF" stroke-width="1.5"/>
<rect x="1533" y="341" width="338" height="20" fill="#ECF6FF"/>
<text x="1554" y="272.0" font-size="18" font-weight="700" fill="#176DB8">05</text>
<text x="1554" y="309.0" font-size="24" font-weight="700" fill="#12253F">Evaluate</text>
<text x="1554" y="338.0" font-size="24" font-weight="700" fill="#12253F">improvements</text>
<circle cx="1556" cy="391" r="3" fill="#176DB8"/>
<text x="1570" y="398.0" font-size="20" font-weight="400" fill="#12253F">Capture user corrections</text>
<text x="1570" y="424.0" font-size="20" font-weight="400" fill="#12253F">and reviewed failure cases.</text>
<circle cx="1556" cy="455" r="3" fill="#176DB8"/>
<text x="1570" y="462.0" font-size="20" font-weight="400" fill="#12253F">Compare changes against</text>
<text x="1570" y="488.0" font-size="20" font-weight="400" fill="#12253F">baselines and held-out</text>
<text x="1570" y="514.0" font-size="20" font-weight="400" fill="#12253F">tests.</text>
<circle cx="1556" cy="545" r="3" fill="#176DB8"/>
<text x="1570" y="552.0" font-size="20" font-weight="400" fill="#12253F">Promote versioned changes</text>
<text x="1570" y="578.0" font-size="20" font-weight="400" fill="#12253F">only after release gates.</text>
<line x1="1553" y1="667" x2="1851" y2="667" stroke="#D9E1EB"/>
<text x="1553" y="692.0" font-size="14" font-weight="700" fill="#176DB8">GOVERNANCE: human review</text>
<rect x="48" y="742" width="586" height="176" rx="14" fill="#F8FAFD" stroke="#D9E1EB" stroke-width="1.5"/>
<text x="70" y="775.0" font-size="16" font-weight="700" fill="#176DB8">USER CONNECTION</text>
<text x="70" y="808.0" font-size="21" font-weight="400" fill="#12253F">Stage 1 receives progress, evidence, clarification,</text>
<text x="70" y="836.0" font-size="21" font-weight="400" fill="#12253F">and final status. A correction or follow-up becomes</text>
<text x="70" y="864.0" font-size="21" font-weight="400" fill="#12253F">a new validated command.</text>
<rect x="667" y="742" width="586" height="176" rx="14" fill="#F8FAFD" stroke="#D9E1EB" stroke-width="1.5"/>
<text x="689" y="775.0" font-size="16" font-weight="700" fill="#176DB8">OPERATIONAL VISIBILITY</text>
<text x="689" y="808.0" font-size="21" font-weight="400" fill="#12253F">OpenTelemetry correlates API, worker, model, and</text>
<text x="689" y="836.0" font-size="21" font-weight="400" fill="#12253F">MCP diagnostics. Dashboards cover errors, latency,</text>
<text x="689" y="864.0" font-size="21" font-weight="400" fill="#12253F">budgets, and unknown outcomes.</text>
<rect x="1286" y="742" width="586" height="176" rx="14" fill="#F8FAFD" stroke="#D9E1EB" stroke-width="1.5"/>
<text x="1308" y="775.0" font-size="16" font-weight="700" fill="#176DB8">RELEASE CONNECTION</text>
<text x="1308" y="808.0" font-size="21" font-weight="400" fill="#12253F">GitHub Actions tests changes; Docker packages</text>
<text x="1308" y="836.0" font-size="21" font-weight="400" fill="#12253F">them; Helm/Kubernetes deploy approved versions.</text>
<text x="1308" y="864.0" font-size="21" font-weight="400" fill="#12253F">Feedback is not automatic retraining.</text>
<rect x="48" y="944" width="1824" height="112" rx="14" fill="#ECF6FF" stroke="#176DB8" stroke-width="1.5"/>
<text x="71" y="977.0" font-size="16" font-weight="700" fill="#176DB8">CONTROL BOUNDARY</text>
<text x="71" y="1014.0" font-size="23" font-weight="700" fill="#12253F">A model saying “done” is not evidence. Recorded outcomes override generated narratives; telemetry is not the approval database.</text>
<text x="48" y="1095.0" font-size="15" font-weight="700" fill="#176DB8">WHY THIS CONNECTION</text>
<text x="48" y="1128.0" font-size="21" font-weight="400" fill="#465971">Progress and delivery remain available without a model-generated status message. Optional reasoning output is separate and non-authoritative.</text>
<text x="48" y="1209.0" font-size="14" font-weight="400" fill="#465971">Stage labels identify responsibilities. LangGraph calls read tools before drafting; approved writes reuse the MCP boundary.</text>
<text x="1705" y="1209.0" font-size="15" font-weight="700" fill="#176DB8">STAGE 6 / 6</text>
</g></svg>