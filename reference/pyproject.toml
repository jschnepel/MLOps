[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "operations-copilot"
version = "0.1.0"
description = "Evidence-backed incident workflow: executable control reference and implementation blueprint"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
web = ["fastapi==0.128.2", "uvicorn==0.48.0", "pydantic==2.13.4"]
test = ["pytest==9.0.2", "httpx==0.28.1"]
# These major-version bounds follow the cited APIs. Resolve/lock and contract-test
# exact versions on an internet-connected machine before enabling integrations.
integrations = ["mcp>=2,<3", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4"]
postgres = ["psycopg[binary,pool]>=3,<4", "langgraph-checkpoint-postgres>=3,<4", "sqlalchemy>=2,<3", "alembic>=1,<2", "pgvector>=0.3,<1"]

[project.scripts]
ops-demo = "operations_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --ignore=tests/integration"
markers = ["integration: external SDK or service contract tests; not part of local core verification"]

[tool.setuptools.package-data]
operations_copilot = ["web/*"]
